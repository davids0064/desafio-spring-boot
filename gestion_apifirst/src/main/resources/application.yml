spring:
  application:
    name: gestion
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/gestiondb
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8081

